name: Deploy independent atlas display sites
on:
  push:
    branches: [main]
    paths: ['public/**', 'deploy/build_pages.py', 'package*.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [zh, en]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build verified display package
        env:
          ATLAS_ORIGIN: ${{ vars.ATLAS_ORIGIN }}
        run: python deploy/build_pages.py --language ${{ matrix.language }}
      - name: Publish to the existing independent Pages project
        if: vars.PAGES_BOOTSTRAP_READY == 'true' && vars.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler pages deploy dist/${{ matrix.language }} --project-name bicyclus-wing-atlas-${{ matrix.language }} --branch main
      - name: Verify the published public display and download guard
        if: vars.PAGES_BOOTSTRAP_READY == 'true' && vars.CLOUDFLARE_ACCOUNT_ID != ''
        run: python deploy/verify_pages.py --language ${{ matrix.language }}
